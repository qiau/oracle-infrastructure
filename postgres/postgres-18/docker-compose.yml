services:
  postgres:
    container_name: postgres-18
    image: postgres:18-trixie
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432" #port untuk vps lain insert ke database

    volumes:
      - ./data:/var/lib/postgresql

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    external: true
    name: backend
