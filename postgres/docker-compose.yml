services:
  postgres:
    image: postgres:18-trixie
    container_name: postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - ./data:/var/lib/postgresql/data

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

networks:
  backend:
    external: true
    name: backend
