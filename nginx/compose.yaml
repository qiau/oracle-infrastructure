services:
  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    restart: unless-stopped

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

      # Media Social Sender
      - /home/ubuntu/oshinesia/oshinesia-social-sender/media:/media/social-sender:ro

      # Media Telegram Relay
      - /home/ubuntu/oshinesia/oshinesia-telegram-relay/media:/media/telegram-relay:ro

    networks:
      - nginx

networks:
  nginx:
    external: true
    name: nginx
