services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped

    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1

    volumes:
      - ./data:/var/lib/telegram-bot-api

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    external: true
    name: backend
