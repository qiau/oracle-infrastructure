services:
  adminer:
    container_name: adminer
    image: adminer:latest
    restart: unless-stopped

    networks:
      - prod-single
      - backend

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  prod-single:
    external: true
    name: prod-single

  backend:
    external: true
    name: backend
