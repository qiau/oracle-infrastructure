x-cloudflared: &cloudflared
  image: cloudflare/cloudflared:latest
  restart: unless-stopped
  command: tunnel --no-autoupdate run
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  cloudflared-multi:
    <<: *cloudflared
    container_name: cloudflared-multi
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN_MULTI}
    networks:
      - prod-multi

  cloudflared-single:
    <<: *cloudflared
    container_name: cloudflared-single
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN_SINGLE}
    networks:
      - prod-single

networks:
  prod-multi:
    external: true
    name: prod-multi
  prod-single:
    external: true
    name: prod-single
